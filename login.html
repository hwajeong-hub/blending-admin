<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLENDING 로그인</title>
<link rel="stylesheet" href="assets/blending.css?v=20261106150000">
<style>
  /* 로그인 화면 틀만 여기에 둔다. 입력·체크박스·버튼·토스트는 공통 컴포넌트 (docs/layout.md 4.4) */
  .login-page { min-height:100%; display:flex; align-items:center; justify-content:center; padding:var(--spacing-4); }
  .login-card {
    width:360px; padding:var(--spacing-12) var(--spacing-8);
    background:var(--bg-surface); border-radius:var(--radius-page); box-shadow:var(--shadow-low);
    display:flex; flex-direction:column; gap:var(--spacing-5);
  }
  .login-head { display:flex; flex-direction:column; align-items:center; gap:var(--spacing-10); }
  .login-logo { width:164px; height:25px; display:block; }
  .login-fields { width:100%; display:flex; flex-direction:column; gap:var(--spacing-1-5); }
  /* 비밀번호 칸과 16 띄운다 (fields gap 6 포함) */
  .login-remember { margin-top:calc(var(--spacing-4) - var(--spacing-1-5)); width:max-content; }

  /* Mobile(≤767): 카드 없이 화면 전체 */
  @media (max-width:767px) {
    .login-page { align-items:flex-start; padding:0; }
    .login-card {
      width:100%; min-height:100vh; padding:150px var(--spacing-4) var(--spacing-10); /* token-ok: 모바일 로고 위치 150 (피그마) */
      background:transparent; border-radius:0; box-shadow:none;
    }
  }
</style>
</head>
<body>
  <main class="login-page">
    <form class="login-card" id="loginForm" novalidate>
      <div class="login-head">
        <img class="login-logo" src="assets/logo.svg" alt="BLENDING">
        <div class="login-fields">
          <div class="box box-block">
            <label class="box-label" for="userId">아이디</label>
            <div class="field"><input id="userId" name="userId" type="text" autocomplete="username" placeholder="내용을 입력해주세요"></div>
          </div>
          <div class="box box-block">
            <label class="box-label" for="userPw">비밀번호</label>
            <div class="field">
              <input id="userPw" name="userPw" type="password" autocomplete="current-password" placeholder="내용을 입력해주세요">
              <button class="field-icon-btn" id="pwToggle" type="button" aria-pressed="false" aria-label="비밀번호 보기"><i class="ic ic-eye-off"></i></button>
            </div>
          </div>
          <label class="cb login-remember">
            <input type="checkbox" id="rememberId">
            <span class="cb-box" aria-hidden="true"></span>
            <span class="cb-label">아이디 기억하기</span>
          </label>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">로그인</button>
    </form>
  </main>

<script src="assets/blending.js?v=20261102105140"></script>
<script>
  const form = document.getElementById('loginForm');
  const idInput = document.getElementById('userId');
  const pwInput = document.getElementById('userPw');
  const remember = document.getElementById('rememberId');
  const submitBtn = form.querySelector('button[type="submit"]');
  const KEY = 'blending.rememberId';
  const warn = (msg) => Blending.toast(msg, 'warning');
  const fieldOf = (input) => input.closest('.field');

  // 아이디 기억하기
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) { idInput.value = saved; remember.checked = true; }
  } catch (e) {}

  // TODO: 실제 인증 API로 교체.
  // 프로토타입: 비밀번호가 "fail"이면 실패 토스트, 그 외에는 공지사항으로 이동합니다.
  async function login(id, pw) { return pw !== 'fail'; }

  // 비밀번호 보기/숨기기
  const pwToggle = document.getElementById('pwToggle');
  pwToggle.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    pwToggle.setAttribute('aria-pressed', String(show));
    pwToggle.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기');
    pwToggle.querySelector('.ic').className = `ic ${show ? 'ic-eye' : 'ic-eye-off'}`;
  });

  // 다시 입력하면 Invalid 해제
  [idInput, pwInput].forEach((el) => el.addEventListener('input', () => fieldOf(el).classList.remove('is-invalid')));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = idInput.value.trim();
    const pw = pwInput.value;
    if (!id || !pw) {
      if (!id) fieldOf(idInput).classList.add('is-invalid');
      if (!pw) fieldOf(pwInput).classList.add('is-invalid');
      warn('아이디와 비밀번호를 입력해주세요.');
      (!id ? idInput : pwInput).focus();
      return;
    }
    try {
      if (remember.checked) localStorage.setItem(KEY, id);
      else localStorage.removeItem(KEY);
    } catch (e) {}
    submitBtn.disabled = true;
    const ok = await login(id, pw);
    submitBtn.disabled = false;
    if (!ok) {
      pwInput.value = '';
      pwInput.focus();
      return warn('아이디 또는 비밀번호가 일치하지 않습니다.');
    }
    location.href = 'notice.html';
  });
</script>
</body>
</html>
